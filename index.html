<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Position Size Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --accent: #3D5AFE;
    --accent-pressed: #2E45D1;
    --text-primary: #111418;
    --text-secondary: #6B7280;
    --text-disabled: #C1C5CC;
    --border: #E4E7EC;
    --success: #1BA672;
    --error: #E5484D;
    --error-bg: #FDEAEA;
    --warning-bg: #FDF3E3;
    --radius-card: 12px;
    --radius-input: 8px;
    --radius-pill: 999px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app{ max-width: 600px; margin: 0 auto; min-height: 100%; }

  .screen{ display:none; min-height:100%; flex-direction:column; }
  .screen.active{ display:flex; }

  .topbar{
    display:flex; align-items:center; gap:4px;
    padding: 8px 8px 0;
    min-height: 56px;
  }
  .step{
    font-size: 12px; font-weight: 500;
    color: var(--text-secondary);
    padding: 0 8px;
  }
  .icon-btn{
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; color: var(--text-primary);
    border-radius: var(--radius-input); cursor:pointer;
  }
  .icon-btn:active{ background: var(--border); }
  .icon-btn svg{ width:22px; height:22px; }

  .head{ padding: 8px 14px 20px; }
  .head h1{ font-size: 26px; font-weight: 700; margin:0; letter-spacing:-.01em; }
  .head p{ font-size: 14px; color: var(--text-secondary); margin: 6px 0 0; }

  .content{ flex:1; padding: 0 14px 20px; display:flex; flex-direction:column; }
  .spacer{ flex:1; min-height: 24px; }
  .actions{ padding-top: 8px; }

  .tabular{ font-variant-numeric: tabular-nums; }

  input{
    width:100%; min-height:52px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-input);
    padding: 0 16px;
    font-size: 16px; font-family: inherit;
    color: var(--text-primary);
    outline:none;
  }
  input:focus{ border-color: var(--accent); }
  input::placeholder{ color: var(--text-disabled); }

  .field{ margin-bottom: 18px; }
  .field > label{
    display:block;
    font-size: 13px; font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .wrap{ position:relative; }
  .wrap .fix{
    position:absolute; top:50%; transform:translateY(-50%);
    left:16px; font-size:16px; color: var(--text-secondary); pointer-events:none;
  }
  .wrap .fix.right{ left:auto; right:16px; }
  .wrap input.pad-l{ padding-left: 34px; }

  .btn{
    width:100%; min-height:56px;
    background: var(--accent); color:#fff;
    border:none; border-radius: var(--radius-card);
    font-size:16px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  .btn:active{ background: var(--accent-pressed); }

  .switch{
    display:flex; background: var(--surface);
    border:1px solid var(--border); border-radius: var(--radius-pill);
    padding:4px; margin-bottom:20px;
  }
  .switch div{
    flex:1; text-align:center; font-size:14px; font-weight:500;
    padding:10px 8px; border-radius: var(--radius-pill);
    color: var(--text-secondary); cursor:pointer; user-select:none;
  }
  .switch div.on{ background: var(--accent); color:#fff; }

  .err{
    font-size:13px; color: var(--error);
    background: var(--error-bg);
    padding:12px 14px; border-radius: var(--radius-input);
    margin-bottom:16px; display:none; line-height:1.4;
  }

  .asset-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .asset-card{
    background: var(--surface);
    border:1px solid var(--border);
    border-radius: var(--radius-card);
    padding:20px 16px; min-height:76px;
    display:flex; align-items:center;
    font-size:17px; font-weight:600;
    cursor:pointer;
  }
  .asset-card:active{ border-color: var(--accent); color: var(--accent); }

  .rblock{ margin-bottom:22px; }
  .rblock .name{ font-size:14px; font-weight:600; margin-bottom:8px; display:block; }
  .chips{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .chip{
    padding:7px 14px; border-radius: var(--radius-pill);
    background: var(--surface); border:1px solid var(--border);
    font-size:13px; font-weight:500; font-family:inherit;
    color: var(--text-primary); cursor:pointer;
  }
  .chip:active{ border-color: var(--accent); color: var(--accent); }

  .rcard{
    background: var(--surface);
    border:1px solid var(--border);
    border-radius: var(--radius-card);
    padding:18px 16px; margin-bottom:12px;
  }
  .rcard-top{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .rcard-account{ font-size:14px; font-weight:600; }
  .tag{
    font-size:10px; font-weight:600;
    padding:3px 8px; border-radius: var(--radius-pill);
    background: var(--warning-bg); color:#8a5a13;
  }
  .lot{ display:flex; align-items:baseline; justify-content:center; gap:8px; margin:14px 0 18px; }
  .lot b{ font-size:52px; font-weight:700; line-height:1; letter-spacing:-.02em; }
  .lot span{ font-size:15px; font-weight:500; color: var(--text-secondary); }
  .rrow{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:14px;
  }
  .rrow.sub{ font-size:12px; color: var(--text-secondary); margin-top:3px; }
  .rrow .k{ color: var(--text-secondary); }
  .rrow.sub .k{ color: var(--text-disabled); }
  .rrow b{ font-weight:600; }
  .rdiv{
    margin-top:12px; padding-top:12px;
    border-top:1px solid var(--border);
    font-size:14px; color: var(--text-secondary);
    display:flex; justify-content:space-between;
  }
  .rdiv b{ color: var(--text-primary); font-weight:600; }

  .note{ font-size:12px; color: var(--text-secondary); margin-top:4px; line-height:1.5; }

  .hist-btn{
    background:none; border:none; padding:14px 0 6px;
    color: var(--accent); font-size:13px; font-weight:500;
    font-family:inherit; cursor:pointer; text-align:left;
  }
  .hist{ display:none; }
  .hist.open{ display:block; }
  .hist-row{
    display:flex; justify-content:space-between; gap:12px;
    padding:8px 0; border-bottom:1px solid var(--border);
    font-size:13px; color: var(--text-secondary);
  }
  .hist-row:last-child{ border-bottom:none; }
  .hist-row b{ color: var(--text-primary); font-weight:500; }

  .sect{ margin-bottom:28px; }
  .sect-title{
    font-size:12px; font-weight:600; color: var(--text-secondary);
    text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px;
  }

  .opt{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-input);
    padding:14px 16px; margin-bottom:8px;
    font-size:15px; font-weight:500;
  }
  .tgl{
    width:48px; height:28px; flex-shrink:0;
    background: var(--border); border:none; border-radius: var(--radius-pill);
    position:relative; cursor:pointer; transition: background .15s ease;
  }
  .tgl::after{
    content:""; position:absolute; top:3px; left:3px;
    width:22px; height:22px; border-radius:50%;
    background:#fff; transition: transform .15s ease;
  }
  .tgl.on{ background: var(--accent); }
  .tgl.on::after{ transform: translateX(20px); }

  .subopt{ display:none; margin:0 0 8px; align-items:center; gap:8px; }
  .subopt.show{ display:flex; }
  .subopt input{ width:80px; min-height:44px; text-align:center; }
  .subopt .chip{ min-height:44px; padding:0 16px; display:flex; align-items:center; }
  .subopt .chip.on{ background: var(--accent); border-color: var(--accent); color:#fff; }

  .card{
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-card); padding:12px; margin-bottom:8px;
  }
  .row{ display:flex; align-items:center; gap:8px; }
  .row input{ min-height:42px; font-size:14px; padding:0 12px; }
  .row .grow{ flex:1; min-width:0; }
  .row .cap{ position:relative; width:110px; flex-shrink:0; }
  .row .cap input{ padding-left:26px; }
  .row .cap .fix{ left:12px; font-size:14px; }
  .row .sym{ flex:1; min-width:0; text-transform:uppercase; font-weight:600; }

  .mini{
    width:36px; height:36px; flex-shrink:0;
    border:none; background:none; color: var(--text-secondary);
    border-radius: var(--radius-input); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
  }
  .mini:active{ background: var(--border); color: var(--text-primary); }
  .mini.del:active{ background: var(--error-bg); color: var(--error); }
  .mini svg{ width:18px; height:18px; }

  .vrow{
    display:flex; align-items:center; gap:8px;
    padding-top:8px; margin-top:8px;
    border-top:1px solid var(--border);
  }
  .vrow .lab{ flex:1; min-width:0; font-size:13px; color: var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vrow .money{ position:relative; width:92px; flex-shrink:0; }
  .vrow .money input{ min-height:42px; font-size:14px; padding:0 10px 0 24px; }
  .vrow .money .fix{ left:10px; font-size:13px; }
  .vrow .money.comm{ display:none; }
  .vrow .money.comm.show{ display:block; }

  .add{
    background:none; border:none; color: var(--accent);
    font-size:14px; font-weight:500; font-family:inherit;
    padding:6px 0; cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">

  <section class="screen" id="s-asset">
    <div class="topbar">
      <span class="step">Étape 1 / 3</span>
      <button class="icon-btn" id="go-settings" aria-label="Paramètres" style="margin-left:auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="head"><h1>Actif</h1></div>
    <div class="content">
      <div class="asset-grid" id="asset-grid"></div>
      <div class="note" id="asset-empty" style="display:none;">Aucun actif. Ajoute-en un dans les Paramètres.</div>
    </div>
  </section>

  <section class="screen" id="s-risk">
    <div class="topbar">
      <button class="icon-btn back" data-to="s-asset" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="step">Étape 2 / 3</span>
    </div>
    <div class="head"><h1>Risque</h1></div>
    <div class="content">
      <div class="switch" id="risk-switch">
        <div data-mode="dollar">$</div>
        <div data-mode="percent">%</div>
      </div>
      <div id="risk-list"></div>
      <div class="err" id="risk-err"></div>
      <div class="spacer"></div>
      <div class="actions"><button class="btn" id="risk-next">Suivant</button></div>
    </div>
  </section>

  <section class="screen" id="s-stop">
    <div class="topbar">
      <button class="icon-btn back" data-to="s-risk" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="step">Étape 3 / 3</span>
    </div>
    <div class="head">
      <h1>Stop</h1>
      <p>Le chiffre lu sur TradingView</p>
    </div>
    <div class="content">
      <div class="field">
        <input class="tabular" type="text" inputmode="decimal" id="stop-input" placeholder="537">
      </div>
      <div class="err" id="stop-err"></div>
      <div class="spacer"></div>
      <div class="actions"><button class="btn" id="stop-next">Calculer</button></div>
    </div>
  </section>

  <section class="screen" id="s-result">
    <div class="topbar">
      <button class="icon-btn back" data-to="s-stop" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="head"><h1 id="result-title">—</h1></div>
    <div class="content">
      <div class="err" id="result-err"></div>
      <div id="result-list"></div>
      <div class="note" id="result-note" style="display:none;"></div>
      <button class="hist-btn" id="hist-btn" style="display:none;"></button>
      <div class="hist" id="hist-list"></div>
      <div class="spacer"></div>
      <div class="actions"><button class="btn" id="new-calc">Nouveau calcul</button></div>
    </div>
  </section>

  <section class="screen" id="s-settings">
    <div class="topbar">
      <button class="icon-btn back" data-to="s-asset" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="head"><h1>Paramètres</h1></div>
    <div class="content">

      <div class="sect">
        <div class="sect-title">Options</div>
        <div class="opt">
          <span>Diviseur de lots</span>
          <button class="tgl" id="tgl-div" role="switch" aria-label="Diviseur de lots"></button>
        </div>
        <div class="subopt" id="div-sub">
          <div class="wrap" style="width:80px;">
            <input class="tabular" type="text" inputmode="decimal" id="div-input">
          </div>
          <button class="chip" data-div="2">2</button>
          <button class="chip" data-div="3">3</button>
          <button class="chip" data-div="4">4</button>
        </div>
        <div class="opt">
          <span>Commissions</span>
          <button class="tgl" id="tgl-comm" role="switch" aria-label="Commissions"></button>
        </div>
      </div>

      <div class="sect">
        <div class="sect-title">Comptes</div>
        <div id="acc-list"></div>
        <button class="add" id="add-acc">+ Ajouter un compte</button>
      </div>

      <div class="sect">
        <div class="sect-title">Actifs — valeur d'1 unité TradingView, pour 1 lot</div>
        <div id="ast-list"></div>
        <button class="add" id="add-ast">+ Ajouter un actif</button>
      </div>

      <div class="spacer"></div>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var KEY = "lotCalc.v2";
  var HIST_MAX = 5;
  var CHIPS_MAX = 3;

  var DEFAULTS = {
    assets: [
      { id:"as1", symbol:"EURUSD" },
      { id:"as2", symbol:"BTCUSD" },
      { id:"as3", symbol:"SP500" },
      { id:"as4", symbol:"WTICOUSD" }
    ],
    accounts: [
      { id:"ac1", name:"Broker 1", capital:null },
      { id:"ac2", name:"Broker 2", capital:null }
    ],
    values: {},
    commissions: {},
    divisorOn: false,
    divisor: 2,
    commissionsOn: false,
    riskMode: "dollar",
    risk: { dollar:{}, percent:{} },
    memory: {},
    assetId: null,
    stop: null,
    history: []
  };

  var state = load();

  function load(){
    var base = JSON.parse(JSON.stringify(DEFAULTS));
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return base;
      var p = JSON.parse(raw);
      for (var k in base) if (p.hasOwnProperty(k) && p[k] !== undefined && p[k] !== null) base[k] = p[k];
    } catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }

    if (!Array.isArray(base.assets)) base.assets = [];
    if (!Array.isArray(base.accounts)) base.accounts = [];
    if (!Array.isArray(base.history)) base.history = [];
    if (typeof base.values !== "object") base.values = {};
    if (typeof base.commissions !== "object") base.commissions = {};
    if (typeof base.memory !== "object") base.memory = {};
    if (!base.risk || typeof base.risk !== "object") base.risk = { dollar:{}, percent:{} };
    if (typeof base.risk.dollar !== "object") base.risk.dollar = {};
    if (typeof base.risk.percent !== "object") base.risk.percent = {};
    if (base.riskMode !== "percent") base.riskMode = "dollar";
    if (!(base.divisor > 0)) base.divisor = 2;
    return base;
  }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  }

  function el(id){ return document.getElementById(id); }
  function uid(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36); }
  function num(v){ var n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; }
  function cell(a, b){ return a + "|" + b; }

  function fmt(n, dec){
    if (typeof n !== "number" || !isFinite(n)) return "—";
    var s = n.toFixed(typeof dec === "number" ? dec : 6);
    if (s.indexOf(".") !== -1) s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s;
  }
  function usd(n){ return "$" + n.toFixed(2); }
  function pct(n){ return n.toFixed(2).replace(/\.?0+$/, "") + " %"; }

  function getAsset(id){
    for (var i=0;i<state.assets.length;i++) if (state.assets[i].id === id) return state.assets[i];
    return null;
  }

  function show(id){
    ["s-asset","s-risk","s-stop","s-result","s-settings"].forEach(function(s){
      el(s).classList.toggle("active", s === id);
    });
    window.scrollTo(0,0);
  }

  document.querySelectorAll(".back").forEach(function(b){
    b.addEventListener("click", function(){
      var to = b.getAttribute("data-to");
      if (to === "s-asset") renderAssets();
      show(to);
    });
  });

  /* ---------- Écran 1 : actif ---------- */

  function renderAssets(){
    var g = el("asset-grid");
    g.innerHTML = "";
    el("asset-empty").style.display = state.assets.length ? "none" : "block";
    state.assets.forEach(function(a){
      var c = document.createElement("div");
      c.className = "asset-card";
      c.textContent = a.symbol || "—";
      c.addEventListener("click", function(){
        state.assetId = a.id;
        save();
        renderRisk();
        show("s-risk");
      });
      g.appendChild(c);
    });
  }

  /* ---------- Écran 2 : risque ---------- */

  function memoryFor(accId, mode){
    var m = state.memory[accId];
    if (!m || !m[mode]) return [];
    return m[mode].slice()
      .sort(function(a,b){ return (b.count - a.count) || (b.last - a.last); })
      .slice(0, CHIPS_MAX)
      .map(function(x){ return x.value; });
  }

  function remember(accId, mode, value){
    state.memory[accId] = state.memory[accId] || { dollar:[], percent:[] };
    var arr = state.memory[accId][mode] = state.memory[accId][mode] || [];
    var hit = null;
    for (var i=0;i<arr.length;i++) if (arr[i].value === value) hit = arr[i];
    if (hit){ hit.count++; hit.last = Date.now(); }
    else arr.push({ value: value, count: 1, last: Date.now() });
    arr.sort(function(a,b){ return (b.count - a.count) || (b.last - a.last); });
    if (arr.length > 10) arr.length = 10;
  }

  function renderRisk(){
    var mode = state.riskMode;
    var map = state.risk[mode];

    document.querySelectorAll("#risk-switch div").forEach(function(d){
      d.classList.toggle("on", d.getAttribute("data-mode") === mode);
    });

    var list = el("risk-list");
    list.innerHTML = "";

    state.accounts.forEach(function(acc){
      var block = document.createElement("div");
      block.className = "rblock";

      var name = document.createElement("span");
      name.className = "name";
      name.textContent = acc.name || "Compte";
      block.appendChild(name);

      var wrap = document.createElement("div");
      wrap.className = "wrap";

      var fix = document.createElement("span");
      fix.className = "fix" + (mode === "percent" ? " right" : "");
      fix.textContent = mode === "percent" ? "%" : "$";

      var inp = document.createElement("input");
      inp.type = "text";
      inp.setAttribute("inputmode", "decimal");
      inp.className = "tabular" + (mode === "dollar" ? " pad-l" : "");
      var cur = map[acc.id];
      inp.value = (cur === null || cur === undefined) ? "" : String(cur);
      inp.addEventListener("input", function(){
        map[acc.id] = num(inp.value);
        save();
      });

      wrap.appendChild(fix);
      wrap.appendChild(inp);
      block.appendChild(wrap);

      var mem = memoryFor(acc.id, mode);
      if (mem.length){
        var chips = document.createElement("div");
        chips.className = "chips";
        mem.forEach(function(v){
          var c = document.createElement("button");
          c.type = "button";
          c.className = "chip tabular";
          c.textContent = mode === "percent" ? (v + " %") : ("$" + v);
          c.addEventListener("click", function(){
            inp.value = String(v);
            map[acc.id] = v;
            save();
          });
          chips.appendChild(c);
        });
        block.appendChild(chips);
      }

      list.appendChild(block);
    });

    el("risk-err").style.display = "none";
  }

  document.querySelectorAll("#risk-switch div").forEach(function(d){
    d.addEventListener("click", function(){
      state.riskMode = d.getAttribute("data-mode");
      save();
      renderRisk();
    });
  });

  el("risk-next").addEventListener("click", function(){
    var map = state.risk[state.riskMode];
    var ok = false;
    for (var i=0;i<state.accounts.length;i++){
      var v = map[state.accounts[i].id];
      if (typeof v === "number" && v > 0){ ok = true; break; }
    }
    if (!ok){
      var e = el("risk-err");
      e.textContent = "Saisis un risque pour au moins un compte.";
      e.style.display = "block";
      return;
    }
    el("risk-err").style.display = "none";
    el("stop-input").value = (state.stop === null || state.stop === undefined) ? "" : String(state.stop);
    el("stop-err").style.display = "none";
    show("s-stop");
  });

  /* ---------- Écran 3 : stop ---------- */

  el("stop-input").addEventListener("input", function(){
    state.stop = num(this.value);
    save();
  });

  el("stop-next").addEventListener("click", function(){
    if (!(state.stop > 0)){
      var e = el("stop-err");
      e.textContent = "Saisis une distance de stop supérieure à 0.";
      e.style.display = "block";
      return;
    }
    el("stop-err").style.display = "none";
    save();
    compute();
  });

  /* ---------- Écran 4 : résultat ---------- */

  function compute(){
    var asset = getAsset(state.assetId);
    if (!asset){ fail("Sélectionne un actif."); return; }
    if (!(state.stop > 0)){ fail("Distance de stop invalide."); return; }

    var mode = state.riskMode;
    var map = state.risk[mode];
    var divisor = state.divisorOn && state.divisor > 0 ? state.divisor : null;

    var results = [];
    var skipped = [];

    state.accounts.forEach(function(acc){
      var r = map[acc.id];
      if (!(r > 0)) return;

      var name = acc.name || "Compte";
      var target;
      if (mode === "percent"){
        if (!(acc.capital > 0)){ skipped.push(name + " (capital non renseigné)"); return; }
        target = acc.capital * (r / 100);
      } else {
        target = r;
      }

      var k = cell(asset.id, acc.id);
      var value = state.values[k];
      if (!(value > 0)){ skipped.push(name + " (valeur non renseignée)"); return; }

      var comm = state.commissionsOn ? (state.commissions[k] || 0) : 0;
      var perLot = state.stop * value + comm;
      if (!(perLot > 0)){ skipped.push(name); return; }

      var raw = target / perLot;
      var lot = Math.round(raw * 100) / 100;
      var atMin = false;
      if (lot < 0.01){ lot = 0.01; atMin = true; }

      var real = lot * perLot;
      var off = Math.abs(real - target) / target;

      results.push({
        name: name,
        lot: lot,
        divided: divisor ? Math.round(lot / divisor * 100) / 100 : null,
        target: target,
        real: real,
        targetPct: mode === "percent" ? r : null,
        realPct: (mode === "percent" && acc.capital > 0) ? (real / acc.capital * 100) : null,
        rounded: off > 0.01,
        atMin: atMin,
        commission: comm * lot
      });

      remember(acc.id, mode, r);
    });

    if (!results.length){
      fail(skipped.length ? skipped.join(" · ") : "Aucun risque saisi.");
      return;
    }

    el("result-err").style.display = "none";
    el("result-title").textContent = asset.symbol + " · stop " + fmt(state.stop, 4);

    var list = el("result-list");
    list.innerHTML = "";

    results.forEach(function(r){
      var c = document.createElement("div");
      c.className = "rcard";

      var top = document.createElement("div");
      top.className = "rcard-top";
      var nm = document.createElement("span");
      nm.className = "rcard-account";
      nm.textContent = r.name;
      top.appendChild(nm);
      if (r.atMin){
        top.appendChild(tag("lot minimum"));
      } else if (r.rounded){
        top.appendChild(tag("arrondi"));
      }
      c.appendChild(top);

      var lot = document.createElement("div");
      lot.className = "lot";
      var b = document.createElement("b");
      b.className = "tabular";
      b.textContent = r.lot.toFixed(2);
      var u = document.createElement("span");
      u.textContent = "lots";
      lot.appendChild(b);
      lot.appendChild(u);
      c.appendChild(lot);

      var isPct = (r.realPct !== null);
      c.appendChild(row("risque", isPct ? pct(r.realPct) : usd(r.real), false));
      c.appendChild(row("visé", isPct ? pct(r.targetPct) : usd(r.target), true));
      if (r.commission > 0){
        c.appendChild(row("dont commission", usd(r.commission), true));
      }

      if (r.divided !== null){
        var d = document.createElement("div");
        d.className = "rdiv";
        var dk = document.createElement("span");
        dk.textContent = "÷ " + state.divisor;
        var dv = document.createElement("b");
        dv.className = "tabular";
        dv.textContent = r.divided >= 0.01 ? r.divided.toFixed(2) : "—";
        d.appendChild(dk);
        d.appendChild(dv);
        c.appendChild(d);
      }

      list.appendChild(c);
    });

    var note = el("result-note");
    if (skipped.length){
      note.textContent = "Ignoré : " + skipped.join(" · ");
      note.style.display = "block";
    } else {
      note.style.display = "none";
    }

    results.forEach(function(r){
      state.history.unshift({
        symbol: asset.symbol,
        name: r.name,
        lot: r.lot,
        risk: (r.realPct !== null) ? pct(r.realPct) : usd(r.real),
        ts: Date.now()
      });
    });
    state.history = state.history.slice(0, HIST_MAX);

    renderHistory();
    save();
    show("s-result");
  }

  function tag(text){
    var t = document.createElement("span");
    t.className = "tag";
    t.textContent = text;
    return t;
  }

  function row(k, v, sub){
    var r = document.createElement("div");
    r.className = "rrow" + (sub ? " sub" : "");
    var a = document.createElement("span");
    a.className = "k";
    a.textContent = k;
    var b = document.createElement(sub ? "span" : "b");
    b.className = "tabular";
    b.textContent = v;
    r.appendChild(a);
    r.appendChild(b);
    return r;
  }

  function fail(msg){
    el("result-title").textContent = "—";
    el("result-list").innerHTML = "";
    el("result-note").style.display = "none";
    var e = el("result-err");
    e.textContent = msg;
    e.style.display = "block";
    renderHistory();
    show("s-result");
  }

  function renderHistory(){
    var btn = el("hist-btn");
    var box = el("hist-list");
    box.innerHTML = "";
    box.classList.remove("open");
    var h = state.history || [];
    btn.style.display = h.length ? "block" : "none";
    btn.textContent = "Historique (" + h.length + ")";
    h.forEach(function(x){
      var r = document.createElement("div");
      r.className = "hist-row";
      var a = document.createElement("span");
      a.innerHTML = "";
      a.textContent = x.symbol + " · " + x.name;
      var b = document.createElement("b");
      b.className = "tabular";
      b.textContent = x.lot.toFixed(2) + " lots · " + x.risk;
      r.appendChild(a);
      r.appendChild(b);
      box.appendChild(r);
    });
  }

  el("hist-btn").addEventListener("click", function(){
    var open = el("hist-list").classList.toggle("open");
    this.textContent = (open ? "Masquer" : "Historique (" + state.history.length + ")");
  });

  el("new-calc").addEventListener("click", function(){
    renderAssets();
    show("s-asset");
  });

  /* ---------- Paramètres ---------- */

  el("go-settings").addEventListener("click", function(){
    renderOptions();
    renderAccounts();
    renderAssetSettings();
    show("s-settings");
  });

  function renderOptions(){
    el("tgl-div").classList.toggle("on", !!state.divisorOn);
    el("div-sub").classList.toggle("show", !!state.divisorOn);
    el("div-input").value = String(state.divisor);
    document.querySelectorAll("#div-sub .chip").forEach(function(c){
      c.classList.toggle("on", num(c.getAttribute("data-div")) === state.divisor);
    });
    el("tgl-comm").classList.toggle("on", !!state.commissionsOn);
  }

  el("tgl-div").addEventListener("click", function(){
    state.divisorOn = !state.divisorOn;
    save();
    renderOptions();
  });

  el("tgl-comm").addEventListener("click", function(){
    state.commissionsOn = !state.commissionsOn;
    save();
    renderOptions();
    renderAssetSettings();
  });

  el("div-input").addEventListener("input", function(){
    var v = num(this.value);
    if (v > 0){ state.divisor = v; save(); }
    document.querySelectorAll("#div-sub .chip").forEach(function(c){
      c.classList.toggle("on", num(c.getAttribute("data-div")) === state.divisor);
    });
  });

  document.querySelectorAll("#div-sub .chip").forEach(function(c){
    c.addEventListener("click", function(){
      state.divisor = num(c.getAttribute("data-div"));
      save();
      renderOptions();
    });
  });

  function renderAccounts(){
    var box = el("acc-list");
    box.innerHTML = "";
    state.accounts.forEach(function(acc){
      var card = document.createElement("div");
      card.className = "card";

      var row = document.createElement("div");
      row.className = "row";

      var name = document.createElement("input");
      name.type = "text";
      name.className = "grow";
      name.value = acc.name || "";
      name.placeholder = "Nom";
      name.addEventListener("input", function(){ acc.name = name.value; save(); });

      var cap = document.createElement("div");
      cap.className = "cap";
      var fix = document.createElement("span");
      fix.className = "fix";
      fix.textContent = "$";
      var capIn = document.createElement("input");
      capIn.type = "text";
      capIn.setAttribute("inputmode", "decimal");
      capIn.className = "tabular";
      capIn.placeholder = "Capital";
      capIn.value = (acc.capital === null || acc.capital === undefined) ? "" : String(acc.capital);
      capIn.addEventListener("input", function(){ acc.capital = num(capIn.value); save(); });
      cap.appendChild(fix);
      cap.appendChild(capIn);

      var del = mini("del", "✕");
      del.addEventListener("click", function(){
        state.accounts = state.accounts.filter(function(x){ return x.id !== acc.id; });
        delete state.risk.dollar[acc.id];
        delete state.risk.percent[acc.id];
        delete state.memory[acc.id];
        state.assets.forEach(function(a){
          delete state.values[cell(a.id, acc.id)];
          delete state.commissions[cell(a.id, acc.id)];
        });
        save();
        renderAccounts();
        renderAssetSettings();
      });

      row.appendChild(name);
      row.appendChild(cap);
      row.appendChild(del);
      card.appendChild(row);
      box.appendChild(card);
    });
  }

  el("add-acc").addEventListener("click", function(){
    state.accounts.push({ id: uid("ac"), name: "Nouveau compte", capital: null });
    save();
    renderAccounts();
    renderAssetSettings();
  });

  function mini(cls, text){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "mini " + cls;
    b.textContent = text;
    return b;
  }

  function moveAsset(id, delta){
    var i = -1;
    for (var n=0;n<state.assets.length;n++) if (state.assets[n].id === id) i = n;
    var j = i + delta;
    if (i < 0 || j < 0 || j >= state.assets.length) return;
    var tmp = state.assets[i];
    state.assets[i] = state.assets[j];
    state.assets[j] = tmp;
    save();
    renderAssetSettings();
  }

  function renderAssetSettings(){
    var box = el("ast-list");
    box.innerHTML = "";

    state.assets.forEach(function(a, index){
      var card = document.createElement("div");
      card.className = "card";

      var head = document.createElement("div");
      head.className = "row";

      var sym = document.createElement("input");
      sym.type = "text";
      sym.className = "sym";
      sym.maxLength = 14;
      sym.value = a.symbol || "";
      sym.addEventListener("input", function(){
        a.symbol = sym.value.toUpperCase();
        save();
      });

      var up = mini("", "▲");
      up.disabled = index === 0;
      up.style.opacity = index === 0 ? ".3" : "1";
      up.addEventListener("click", function(){ moveAsset(a.id, -1); });

      var down = mini("", "▼");
      down.disabled = index === state.assets.length - 1;
      down.style.opacity = index === state.assets.length - 1 ? ".3" : "1";
      down.addEventListener("click", function(){ moveAsset(a.id, 1); });

      var del = mini("del", "✕");
      del.addEventListener("click", function(){
        state.assets = state.assets.filter(function(x){ return x.id !== a.id; });
        state.accounts.forEach(function(acc){
          delete state.values[cell(a.id, acc.id)];
          delete state.commissions[cell(a.id, acc.id)];
        });
        if (state.assetId === a.id) state.assetId = null;
        save();
        renderAssetSettings();
      });

      head.appendChild(sym);
      head.appendChild(up);
      head.appendChild(down);
      head.appendChild(del);
      card.appendChild(head);

      state.accounts.forEach(function(acc){
        var k = cell(a.id, acc.id);

        var vrow = document.createElement("div");
        vrow.className = "vrow";

        var lab = document.createElement("div");
        lab.className = "lab";
        lab.textContent = acc.name || "Compte";

        vrow.appendChild(lab);
        vrow.appendChild(moneyField(state.values[k], "valeur", function(v){
          if (v === null) delete state.values[k]; else state.values[k] = v;
          save();
        }, false));
        vrow.appendChild(moneyField(state.commissions[k], "comm.", function(v){
          if (v === null) delete state.commissions[k]; else state.commissions[k] = v;
          save();
        }, true));

        card.appendChild(vrow);
      });

      box.appendChild(card);
    });
  }

  function moneyField(value, placeholder, onChange, isComm){
    var w = document.createElement("div");
    w.className = "money" + (isComm ? " comm" + (state.commissionsOn ? " show" : "") : "");
    var fix = document.createElement("span");
    fix.className = "fix";
    fix.textContent = "$";
    var inp = document.createElement("input");
    inp.type = "text";
    inp.setAttribute("inputmode", "decimal");
    inp.className = "tabular";
    inp.placeholder = placeholder;
    inp.value = (value === null || value === undefined) ? "" : String(value);
    inp.addEventListener("input", function(){
      var v = num(inp.value);
      onChange(v !== null && v > 0 ? v : null);
    });
    w.appendChild(fix);
    w.appendChild(inp);
    return w;
  }

  el("add-ast").addEventListener("click", function(){
    state.assets.push({ id: uid("as"), symbol: "NOUVEAU" });
    save();
    renderAssetSettings();
  });

  renderAssets();
  renderHistory();
  show("s-asset");
})();
</script>
</body>
</html>
